<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Unser gemeinsames Rezeptbuch">
  <title>Rezeptbuch</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    /* Nur diese zwei Werte vor dem Hochladen eintragen.
       Supabase Dashboard → Project Settings → API */
    window.REZEPTBUCH_CONFIG = {
      supabaseUrl: "https://YOUR_PROJECT_REF.supabase.co",
      supabaseAnonKey: "YOUR_SUPABASE_ANON_OR_PUBLISHABLE_KEY"
    };
  </script>
  <style>
    :root{--ink:#24352d;--muted:#64756c;--leaf:#356344;--leaf-dark:#234631;--cream:#f7f5ed;--paper:#fffefa;--line:#dbe5d9;--coral:#bd5545;--shadow:0 12px 32px #22442a14}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.hero{background:linear-gradient(135deg,#234631,#487b55);color:#fff;padding:42px max(22px,calc((100vw - 1120px)/2));position:relative;overflow:hidden}.hero:after{content:"✿";font-size:220px;position:absolute;right:-25px;top:-65px;opacity:.1}.nav{display:flex;justify-content:space-between;gap:16px;align-items:center;position:relative;z-index:1}.brand{font-family:Georgia,serif;font-size:1.25rem;font-weight:bold}.hero h1{font:clamp(2.5rem,6vw,4.8rem)/1.05 Georgia,serif;margin:72px 0 10px;position:relative;z-index:1}.hero p{margin:0;color:#e3efdf;position:relative;z-index:1}.wrap{max-width:1120px;margin:auto;padding:28px 22px 72px}.toolbar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;margin-bottom:28px}.search{border:1px solid var(--line);border-radius:999px;background:#fff;padding:11px 16px;min-width:min(100%,320px);outline-color:var(--leaf)}.filters{display:flex;gap:8px;flex-wrap:wrap}.chip,.btn{border:0;border-radius:999px;padding:10px 15px;font-weight:650}.chip{background:#e8eee4;color:var(--leaf-dark)}.chip.active,.btn.primary{background:var(--leaf);color:#fff}.btn.secondary{background:transparent;border:1px solid #fff;color:#fff}.btn.danger{background:#fff0ed;color:#963a2d}.btn.small{padding:7px 11px;font-size:.9rem}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:20px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}.photo{height:176px;background:#dce9d8;color:#496653;display:grid;place-items:center;font-size:3rem}.photo img{width:100%;height:100%;object-fit:cover}.card-body{padding:18px;display:flex;gap:10px;flex-direction:column;flex:1}.meta{color:var(--muted);font-size:.9rem}.card h2{font:1.45rem/1.15 Georgia,serif;margin:0}.card p{margin:0;color:var(--muted)}.card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px}.empty{grid-column:1/-1;text-align:center;padding:64px 20px;color:var(--muted)}.notice{background:#fff4cf;border:1px solid #f0d776;border-radius:12px;padding:13px 16px;margin-bottom:22px}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#14271999;display:grid;place-items:center;padding:20px;z-index:10}.dialog{width:min(680px,100%);max-height:90vh;overflow:auto;background:var(--paper);border-radius:18px;padding:25px;box-shadow:0 24px 70px #0005}.dialog h2{font:2rem Georgia,serif;margin:0 0 16px}.close{float:right;background:none;border:0;font-size:1.6rem;color:var(--muted)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.field{display:grid;gap:6px;font-weight:650}.field input,.field textarea,.field select{border:1px solid #cbdacb;border-radius:9px;padding:10px;background:#fff;color:var(--ink);font-weight:400}.field textarea{min-height:110px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:19px;flex-wrap:wrap}.detail-photo{width:100%;max-height:300px;object-fit:cover;border-radius:12px}.detail-text{white-space:pre-line}.adminbar{background:#e5f1df;color:var(--leaf-dark);padding:11px 14px;border-radius:12px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:10px}.error{color:#a2382b;margin-top:10px}.muted{color:var(--muted)}@media(max-width:540px){.form-grid{grid-template-columns:1fr}.hero h1{margin-top:54px}.wrap{padding-inline:14px}.dialog{padding:19px}.toolbar{align-items:stretch}.search{width:100%}}
  </style>
</head>
<body>
  <header class="hero"><div class="nav"><span class="brand">🌿 Rezeptbuch</span><button class="btn secondary" id="adminOpen">Verwalten</button></div><h1>Rezeptbuch</h1></header>
  <main class="wrap">
    <div class="notice hidden" id="configNotice">Bitte oben in dieser HTML-Datei die beiden Supabase-Werte eintragen. Die Anleitung steht in README.md.</div>
    <section class="adminbar hidden" id="adminBar"><span>Verwaltung ist freigeschaltet.</span><span><button class="btn small" id="exportBackup">Backup exportieren</button> <button class="btn small" id="importBackup">Backup importieren</button> <button class="btn primary small" id="newRecipe">+ Rezept hinzufügen</button> <button class="btn small" id="signOut">Sperren</button></span></section>
    <input class="hidden" id="backupFile" type="file" accept="application/json,.json">
    <div class="toolbar"><input class="search" id="search" aria-label="Rezepte durchsuchen" placeholder="🔎  Rezepte durchsuchen"><div class="filters" id="filters"></div></div>
    <section class="grid" id="recipeGrid" aria-live="polite"><div class="empty">Rezepte werden geladen …</div></section>
  </main>

  <div class="modal hidden" id="authModal"><div class="dialog"><button class="close" data-close="authModal" aria-label="Schließen">×</button><h2>Verwaltung freischalten</h2><p class="muted">Gib den gemeinsamen Verwaltungscode ein.</p><form id="loginForm"><label class="field">Passwort<input type="password" id="loginPassword" required autocomplete="current-password"></label><p class="error hidden" id="loginError"></p><div class="actions"><button class="btn primary" type="submit">Freischalten</button></div></form></div></div>
  <div class="modal hidden" id="recipeModal"><div class="dialog"><button class="close" data-close="recipeModal" aria-label="Schließen">×</button><h2 id="formTitle">Rezept hinzufügen</h2><form id="recipeForm"><input type="hidden" id="recipeId"><div class="form-grid"><label class="field full">Name<input id="title" maxlength="140" required></label><label class="field">Kategorie<input id="category" value="Sonstiges" maxlength="50" required></label><label class="field">Zubereitungszeit (Minuten)<input id="duration" type="number" min="0"></label><label class="field">Portionen<input id="servings" type="number" min="1"></label><label class="field">Foto <span class="muted">(JPG, PNG, WebP, max. 5 MB)</span><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><label class="field full">Kurzbeschreibung<textarea id="description" maxlength="600" placeholder="Was macht dieses Rezept besonders?"></textarea></label><label class="field full">Zutaten <span class="muted">(eine pro Zeile)</span><textarea id="ingredients" required></textarea></label><label class="field full">Zubereitung<textarea id="instructions" required></textarea></label></div><p class="error hidden" id="formError"></p><div class="actions"><button class="btn danger hidden" type="button" id="deleteRecipe">Rezept löschen</button><button class="btn primary" type="submit" id="saveRecipe">Speichern</button></div></form></div></div>
  <div class="modal hidden" id="detailModal"><div class="dialog"><button class="close" data-close="detailModal" aria-label="Schließen">×</button><div id="detailContent"></div></div></div>

  <script>
  (() => {
    const cfg = window.REZEPTBUCH_CONFIG || {};
    const configured = cfg.supabaseUrl && !cfg.supabaseUrl.includes('YOUR_') && cfg.supabaseAnonKey && !cfg.supabaseAnonKey.includes('YOUR_');
    const localMode = !configured;
    const $ = id => document.getElementById(id); let db, recipes = [], activeCategory = 'Alle', admin = false;
    const escape = value => String(value || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const photoUrl = path => path ? (path.startsWith('data:') ? path : db.storage.from('recipe-photos').getPublicUrl(path).data.publicUrl) : '';
    const show = id => $(id).classList.remove('hidden'), hide = id => $(id).classList.add('hidden');
    const err = (id, message) => { $(id).textContent = message; $(id).classList.remove('hidden'); };
    const clearErr = id => hide(id);
    function categories(){ return ['Alle', ...new Set(recipes.map(r => r.category).filter(Boolean).sort((a,b)=>a.localeCompare(b,'de')))]; }
    function renderFilters(){ $('filters').innerHTML = categories().map(c => `<button class="chip ${c===activeCategory?'active':''}" data-category="${escape(c)}">${escape(c)}</button>`).join(''); }
    function render(){
      const q = $('search').value.trim().toLocaleLowerCase('de');
      const shown = recipes.filter(r => (activeCategory==='Alle'||r.category===activeCategory) && [r.title,r.description,r.ingredients,r.category].join(' ').toLocaleLowerCase('de').includes(q));
      $('recipeGrid').innerHTML = shown.length ? shown.map(r => `<article class="card"><div class="photo">${r.photo_path?`<img loading="lazy" src="${photoUrl(r.photo_path)}" alt="${escape(r.title)}">`:'🍲'}</div><div class="card-body"><div class="meta">${escape(r.category)}${r.duration_minutes!=null?' · '+r.duration_minutes+' Min.':''}</div><h2>${escape(r.title)}</h2><p>${escape(r.description)}</p><div class="card-footer"><button class="btn primary small" data-detail="${r.id}">Rezept ansehen</button>${admin?`<button class="btn small" data-edit="${r.id}">Bearbeiten</button>`:''}</div></div></article>`).join('') : '<div class="empty">Noch kein passendes Rezept gefunden.</div>';
    }
    async function load(){
      if(localMode){ recipes=JSON.parse(localStorage.getItem('rezeptbuch_recipes')||'[]'); renderFilters(); render(); return; }
      const {data,error} = await db.from('recipes').select('*').order('created_at',{ascending:false});
      if(error){ $('recipeGrid').innerHTML = `<div class="empty">Rezepte konnten nicht geladen werden. ${escape(error.message)}</div>`; return; }
      recipes = data; renderFilters(); render();
    }
    const adminPassword = () => sessionStorage.getItem('rezeptbuch_admin_password') || '';
    async function adminCall(action, payload = {}) { const {data,error}=await db.functions.invoke('recipe-admin',{body:{action,password:adminPassword(),...payload}}); if(error)throw error; if(data?.error)throw new Error(data.error); return data; }
    async function refreshAuth(){ admin = Boolean(adminPassword()); $('adminBar').classList.toggle('hidden',!admin); $('adminOpen').textContent = admin ? 'Verwaltung' : 'Verwalten'; render(); }
    function openDetail(id){ const r=recipes.find(x=>x.id===id); if(!r)return; $('detailContent').innerHTML=`${r.photo_path?`<img class="detail-photo" src="${photoUrl(r.photo_path)}" alt="${escape(r.title)}">`:''}<p class="meta">${escape(r.category)}${r.duration_minutes!=null?' · '+r.duration_minutes+' Min.':''}${r.servings?' · '+r.servings+' Portionen':''}</p><h2>${escape(r.title)}</h2>${r.description?`<p>${escape(r.description)}</p>`:''}<h3>Zutaten</h3><p class="detail-text">${escape(r.ingredients)}</p><h3>Zubereitung</h3><p class="detail-text">${escape(r.instructions)}</p>`; show('detailModal'); }
    function openForm(id){
      const r=recipes.find(x=>x.id===id); $('recipeForm').reset(); clearErr('formError'); $('recipeId').value=r?.id||''; $('formTitle').textContent=r?'Rezept bearbeiten':'Rezept hinzufügen';
      ['title','category','description','ingredients','instructions'].forEach(k=>$(k).value=r?.[k]||''); $('duration').value=r?.duration_minutes??''; $('servings').value=r?.servings??''; $('deleteRecipe').classList.toggle('hidden',!r); show('recipeModal');
    }
    async function photoData(file){ if(!file)return null; if(file.size>5242880)throw new Error('Das Bild ist größer als 5 MB.'); return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve({name:file.name,type:file.type,dataUrl:reader.result});reader.onerror=()=>reject(new Error('Bild konnte nicht gelesen werden.'));reader.readAsDataURL(file);}); }
    $('search').addEventListener('input',render); $('filters').addEventListener('click',e=>{const b=e.target.closest('[data-category]');if(b){activeCategory=b.dataset.category;renderFilters();render();}});
    $('recipeGrid').addEventListener('click',e=>{const d=e.target.closest('[data-detail]'),edit=e.target.closest('[data-edit]');if(d)openDetail(d.dataset.detail);if(edit)openForm(edit.dataset.edit);});
    document.addEventListener('click',e=>{const close=e.target.closest('[data-close]');if(close)hide(close.dataset.close);});
    $('adminOpen').onclick=()=>admin?openForm():show('authModal'); $('newRecipe').onclick=()=>openForm();
    $('loginForm').onsubmit=async e=>{e.preventDefault();clearErr('loginError');const password=$('loginPassword').value;try{if(localMode){if(password!=='1398763')throw new Error('Falsch');}else{const {data,error}=await db.functions.invoke('recipe-admin',{body:{action:'verify',password}});if(error||data?.error)throw new Error('Falsch');}sessionStorage.setItem('rezeptbuch_admin_password',password);await refreshAuth();hide('authModal');$('loginForm').reset();}catch(ex){err('loginError','Das Passwort ist nicht korrekt oder der Verwaltungsdienst ist nicht eingerichtet.');}};
    $('signOut').onclick=async()=>{sessionStorage.removeItem('rezeptbuch_admin_password');await refreshAuth();};
    $('exportBackup').onclick=()=>{const blob=new Blob([JSON.stringify({format:'rezeptbuch-backup',version:1,exported_at:new Date().toISOString(),recipes},null,2)],{type:'application/json'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=`rezeptbuch-backup-${new Date().toISOString().slice(0,10)}.json`;link.click();URL.revokeObjectURL(link.href);};
    $('importBackup').onclick=()=>$('backupFile').click();
    $('backupFile').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{const backup=JSON.parse(await file.text());if(backup.format!=='rezeptbuch-backup'||!Array.isArray(backup.recipes))throw new Error('Keine gültige Rezeptbuch-Backup-Datei.');if(!confirm(`${backup.recipes.length} Rezepte importieren bzw. aktualisieren?`))return;if(localMode){recipes=backup.recipes;localStorage.setItem('rezeptbuch_recipes',JSON.stringify(recipes));}else await adminCall('import',{recipes:backup.recipes});await load();alert('Backup wurde importiert.');}catch(ex){alert(`Import fehlgeschlagen: ${ex.message||'Ungültige Datei.'}`);}};
    $('recipeForm').onsubmit=async e=>{e.preventDefault();clearErr('formError');const save=$('saveRecipe');save.disabled=true;save.textContent='Speichert …';try{const id=$('recipeId').value||crypto.randomUUID();const record={id,title:$('title').value.trim(),category:$('category').value.trim(),description:$('description').value.trim(),ingredients:$('ingredients').value.trim(),instructions:$('instructions').value.trim(),duration_minutes:$('duration').value?Number($('duration').value):null,servings:$('servings').value?Number($('servings').value):null,updated_at:new Date().toISOString()};const photo=await photoData($('photo').files[0]);if(localMode){const previous=recipes.findIndex(r=>r.id===id);if(photo)record.photo_path=photo.dataUrl;else if(previous>=0)record.photo_path=recipes[previous].photo_path;record.created_at=previous>=0?recipes[previous].created_at:new Date().toISOString();if(previous>=0)recipes[previous]=record;else recipes.unshift(record);localStorage.setItem('rezeptbuch_recipes',JSON.stringify(recipes));}else await adminCall('save',{recipe:record,photo});hide('recipeModal');await load();}catch(ex){err('formError',ex.message||'Speichern fehlgeschlagen.');}finally{save.disabled=false;save.textContent='Speichern';}};
    $('deleteRecipe').onclick=async()=>{const id=$('recipeId').value,r=recipes.find(x=>x.id===id);if(!confirm(`„${r?.title||'Dieses Rezept'}“ wirklich löschen?`))return;try{if(localMode){recipes=recipes.filter(x=>x.id!==id);localStorage.setItem('rezeptbuch_recipes',JSON.stringify(recipes));}else await adminCall('delete',{id});hide('recipeModal');await load();}catch(ex){err('formError',ex.message||'Löschen fehlgeschlagen.');}};
    if(!configured){$('configNotice').textContent='Lokaler Modus: Verwaltung funktioniert sofort, die Rezepte bleiben jedoch nur in diesem Browser gespeichert.';show('configNotice');refreshAuth();load();return;}
    db=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey); refreshAuth(); load();
  })();
  </script>
</body>
</html>
